/* Mise en page : carte plein écran ; en haut, la recherche puis les panneaux routiers du guidage ; en bas, une feuille d'action. */
:root{
  --bg:#EDEFE9; --surface:#FFFFFF; --surface-2:#F1F3EE; --ink:#151A21; --muted:#56606E; --line:#D9DED7;
  --blue:#0F4C8A; --on-blue:#FFFFFF; --link:#0F4C8A; --blue-soft:#E4EDF7;
  --yellow:#F7B500; --on-yellow:#15130B;
  --red:#C1121C; --green:#2E7D46; --asphalt:#1B2129; --puck:#1E6FD9;
  --map-ink:#2B3138; --map-ink2:#5A5F67; --map-halo:#F5F6EF; --map-green:#3B6A37; --map-water:#2C6791;
  --shadow:0 6px 22px rgba(21,26,33,.2); --shadow-s:0 2px 8px rgba(21,26,33,.18);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1216; --surface:#181D24; --surface-2:#222933; --ink:#EEF1F4; --muted:#9DA8B6; --line:#2E3641;
    --blue:#12579E; --on-blue:#FFFFFF; --link:#86BDF7; --blue-soft:#1B2D44;
    --yellow:#F7B500; --on-yellow:#15130B;
    --red:#E0434A; --green:#43A566; --asphalt:#2B333E; --puck:#4C9AF7;
    --map-ink:#E7EBEF; --map-ink2:#AEB6C0; --map-halo:#11161A; --map-green:#8CBB8F; --map-water:#84BAE2;
    --shadow:0 6px 22px rgba(0,0,0,.55); --shadow-s:0 2px 8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#181D24; --surface-2:#222933; --ink:#EEF1F4; --muted:#9DA8B6; --line:#2E3641;
  --blue:#12579E; --on-blue:#FFFFFF; --link:#86BDF7; --blue-soft:#1B2D44;
  --yellow:#F7B500; --on-yellow:#15130B;
  --red:#E0434A; --green:#43A566; --asphalt:#2B333E; --puck:#4C9AF7;
  --map-ink:#E7EBEF; --map-ink2:#AEB6C0; --map-halo:#11161A; --map-green:#8CBB8F; --map-water:#84BAE2;
  --shadow:0 6px 22px rgba(0,0,0,.55); --shadow-s:0 2px 8px rgba(0,0,0,.5);
  color-scheme:dark;
}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button,a,summary,input,select{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
a{color:var(--link)}
h2,h3,p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{width:26px;height:26px;flex:none}
.sg{display:block}
.mv{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}

#map{position:fixed;inset:0;background:var(--bg)}
#map .fail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink);background:var(--bg)}
#map .fail>div{max-width:340px;display:grid;gap:14px;justify-items:center}
#map .fail svg{width:54px;height:54px}
#map .fail p{font-size:16px;line-height:1.45;margin:0}
#map .fail .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- couche d'interface ---------- */
#ui{position:fixed;inset:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding-top:calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#ui > *{pointer-events:auto}
#top{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#searchbar{display:flex;align-items:center;gap:2px;width:100%;height:52px;padding:0 5px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);box-sizing:border-box}
#q{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:500 17px var(--font);outline:none;padding:0 2px;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--muted);opacity:1}
#q::-webkit-search-cancel-button{display:none}
#searchbar:has(#q:focus){outline:3px solid var(--yellow);outline-offset:1px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;flex:none}
.iconbtn[aria-pressed="false"]{color:var(--muted)}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-self:stretch;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 6px var(--gl)}
#chips::-webkit-scrollbar,.alts::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 10px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-s);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.chip .ic{width:18px;height:18px}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.chip.sm{height:34px;font-size:13.5px;box-shadow:none;border:1px solid var(--line);padding:0 12px}
.chip.sm[aria-pressed="true"]{border-color:transparent}
#demoflag{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--on-yellow);border-radius:8px;padding:3px;box-shadow:var(--shadow-s);font-size:13px}
#demoflag b{font:700 12.5px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--on-yellow);border-radius:5px;padding:4px 6px}
#demoflag span{padding-right:8px;font-weight:600}
.navon #top,#app[data-view="search"] #chips,#app[data-view="search"] #demoflag,#app[data-view="search"] #side,#app[data-view="search"] #attrib{display:none}
.navon #layers{display:none}

/* ---------- panneaux routiers ---------- */
.sign{padding:3px;border-radius:13px;box-shadow:var(--shadow);width:100%;max-width:460px;box-sizing:border-box}
.sign .in{border:2px solid;border-radius:10px}
.sign.blue{background:var(--blue);color:var(--on-blue)}
.sign.blue .in{border-color:rgba(255,255,255,.92)}
.sign.yellow{background:var(--yellow);color:var(--on-yellow)}
.sign.yellow .in{border-color:var(--on-yellow)}
#navsign .in{display:flex;align-items:center;gap:12px;padding:8px 14px 9px 8px}
#ns-arrow{width:58px;height:58px;flex:none}
.ns-t{min-width:0}
#ns-dist{font:700 34px/1 var(--cond);letter-spacing:.01em;font-variant-numeric:tabular-nums}
#ns-act{font:600 17px/1.2 var(--font);margin-top:2px}
#ns-road{font:700 19px/1.15 var(--cond);text-transform:uppercase;letter-spacing:.045em;margin-top:2px;overflow-wrap:anywhere}
#ns-under{display:flex;align-items:flex-start;gap:6px;margin:-11px 0 0 14px;pointer-events:none}
#ns-then{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--on-blue);border-radius:0 0 10px 10px;padding:6px 12px 6px 8px;font:600 14px var(--font);box-shadow:var(--shadow-s)}
/* guidage par voie : des flèches blanches sur le bitume, la bonne voie en clair */
#lanes{display:flex;background:var(--asphalt);border-radius:0 0 10px 10px;padding:7px 5px 5px;box-shadow:var(--shadow-s)}
.ln{display:block;width:24px;height:28px;padding:0 4px;color:rgba(255,255,255,.28);border-left:2px dashed rgba(255,255,255,.4)}
.ln:first-child{border-left:0}
.ln.ok{color:rgba(255,255,255,.72)}
.ln.on{color:#fff}
.ln .mv{width:100%;height:100%;display:block}
#ns-then .mv{width:22px;height:22px}
#alert .in{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 10px;padding:8px 10px}
#al-ic{width:42px}
.al-t b{display:block;font:700 19px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.05em}
.al-t span{display:block;font-size:13.5px;font-weight:600}
.al-b{grid-column:1/-1;display:flex;gap:8px}
.al-b button{flex:1;min-height:38px;border:2px solid var(--on-yellow);border-radius:8px;font-weight:700;text-align:center}

/* ---------- boutons flottants, compteur, mentions ---------- */
#side{position:fixed;z-index:6;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(var(--sheet-h, 0px) + 14px);display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab.on{color:var(--link)}
.fab.report .sg{width:32px;height:29px;margin-top:-2px}
#north .ic{width:26px;height:26px;transition:transform .1s linear}
#speed{position:fixed;z-index:6;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(var(--sheet-h, 0px) + 32px);display:flex;align-items:flex-end;gap:8px}
#speedo{width:64px;height:64px;border-radius:50%;background:var(--asphalt);color:#fff;border:2px solid rgba(255,255,255,.85);box-sizing:border-box;display:grid;place-content:center;text-align:center;box-shadow:var(--shadow)}
#speedo b{font:700 27px/0.95 var(--cond);font-variant-numeric:tabular-nums}
#speedo span{font:600 10px/1 var(--font);opacity:.85}
#speedo.over{background:var(--red)}
#limit{width:50px;height:50px;border-radius:50%;background:#fff;border:6px solid #C1121C;box-sizing:border-box;color:#111;display:grid;place-items:center;font:700 21px/1 var(--cond);box-shadow:var(--shadow-s)}
/* limitation estimée d'après le type de route (panneau inconnu de la carte) : cercle gris, en pointillés */
#limit.est{border:4px dashed #7A828C;color:#3B424B}
#attrib{position:fixed;z-index:5;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(var(--sheet-h, 0px) + 6px);font:500 10.5px/1.2 var(--font);color:var(--ink);background:color-mix(in srgb, var(--surface) 80%, transparent);padding:2px 6px;border-radius:6px;max-width:calc(100% - 100px)}
#attrib a{color:inherit;text-decoration:none}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h, 0px) + 78px);width:max-content;max-width:min(86vw, 420px);background:var(--asphalt);color:#fff;padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);text-align:center;font-weight:500}

/* ---------- feuille d'action ---------- */
/* le panneau peint son fond et ne défile pas ; c'est son contenu, sans fond, qui défile.
   (un bloc défilant à fond opaque posé sur la carte la faisait disparaître dans certaines versions de Chrome) */
#sheet{position:fixed;z-index:8;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -4px 22px rgba(21,26,33,.2);box-sizing:border-box;
  max-height:64%;display:flex;flex-direction:column;overflow:hidden}
#sheet-in{flex:1 1 auto;min-height:0;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;background:transparent;
  padding-block:14px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sh{display:flex;align-items:flex-start;gap:8px}
.sh-t{flex:1;min-width:0}
.sh h2{font:700 23px/1.12 var(--cond);letter-spacing:.01em;overflow-wrap:anywhere;text-wrap:balance}
.sh p{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.sh .iconbtn{margin:-6px -8px 0 0;background:var(--surface-2);width:38px;height:38px;border-radius:50%}
.quick{display:flex;gap:10px}
.qd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.qd .ic{color:var(--link)}
.qd span{min-width:0}
.qd b{display:block;font-weight:600}
.qd small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.democard{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1px 8px;width:100%;box-sizing:border-box;margin-top:10px;padding:10px 12px 11px 14px;border-radius:12px;background:var(--blue);color:var(--on-blue)}
.democard .dc-t{font:700 12.5px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.democard b{font:700 20px/1.15 var(--cond);grid-column:1}
.democard small{grid-column:1;font-size:13px;opacity:.9}
.democard .ic{grid-column:2;grid-row:1 / span 3}
.list{margin-top:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:10px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ri{width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.ri .ic{width:19px;height:19px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;overflow-wrap:anywhere}
.rt small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.rr{flex:none;font:700 16px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--muted)}
.rr.price{color:var(--ink);font-size:19px}
.rr.price.best{color:var(--green)}
.empty{color:var(--muted);padding:14px 2px 6px}
.hint{font:700 12.5px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 14px 2px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.wx{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);margin:10px 0 0}
.wx svg{width:18px;height:18px;flex:none;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);box-sizing:border-box}
.btn.primary{background:var(--blue);color:var(--on-blue);border-color:transparent}
.btn.danger{color:var(--red)}
.btn.big{min-height:52px;font-size:17px;flex:1}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.actions.sub{gap:20px;margin-top:6px}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--link);font-weight:600;min-height:40px}
.link .ic{width:19px;height:19px}
.link.inl{display:inline;min-height:0;text-decoration:underline}
.savemenu{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savemenu .chip{box-shadow:none;border:1px solid var(--line)}
.facts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.facts li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;overflow-wrap:anywhere}
.facts li > *{min-width:0}
.facts .ic{width:18px;height:18px;color:var(--muted);margin-top:1px}
.sel{user-select:all;-webkit-user-select:all}
a.btn{text-decoration:none}
.addr{overflow-wrap:anywhere;color:var(--ink)}
.about p + p{margin-top:10px}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:10px}
.pr{background:var(--surface-2);border-radius:10px;padding:7px 10px;border:2px solid transparent}
.pr span{display:block;font-size:12px;color:var(--muted)}
.pr b{font:700 20px/1.15 var(--cond);font-variant-numeric:tabular-nums}
.pr.me{border-color:var(--link)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;min-height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.seg .ic{width:20px;height:20px}
.alts{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 6px var(--gl)}
.alt{flex:none;width:min(62vw, 214px);box-sizing:border-box;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:3px}
.alt[aria-checked="true"]{border-color:var(--link);background:var(--blue-soft)}
.alt b{font:700 29px/1 var(--cond);font-variant-numeric:tabular-nums}
.am{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px;min-height:21px}
.tag{font:600 12px/1 var(--font);padding:4px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.fast{background:color-mix(in srgb, var(--green) 18%, var(--surface));color:var(--green)}
.tag.toll{background:color-mix(in srgb, var(--yellow) 34%, var(--surface));color:var(--ink)}
.ax{font-size:12.5px;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.steps{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.steps summary{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:600;color:var(--link);cursor:pointer;list-style:none}
.steps summary::-webkit-details-marker{display:none}
.steps ol{list-style:none;margin:4px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.sa{width:28px;height:28px;color:var(--muted)}
.st{min-width:0;overflow-wrap:anywhere}
.sd{font:700 15px/1 var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}
.navbar{display:flex;align-items:center;gap:18px}
.navbar b{display:block;white-space:nowrap;font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.nb-main b{font-size:36px}
.navbar span{display:block;font-size:13px;color:var(--muted)}
.nb-btns{margin-left:auto;display:flex;align-items:center;gap:6px}
.nb-btns .btn{min-height:44px;padding:0 14px}
.simbar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.simbar span{flex:1}
.repgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.rep{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:13.5px;text-align:center;min-width:0}
.rep .sg{width:46px;height:42px}
.stats{display:flex;gap:28px;margin-top:10px}
.stats b{display:block;font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.set h3,.about h3{font:700 13px/1.2 var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.tog{display:flex;align-items:center;gap:12px;min-height:46px}
.tog input{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s}
.tog input:checked{background:var(--green)}
.tog input:checked::after{left:21px}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px}
.field span{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.field input,.field select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:500 15px var(--font);padding:0 8px;box-sizing:border-box}
.field input{width:76px;text-align:right}
.credits{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.credits b{font-weight:700}
.credits span{color:var(--muted)}

/* ---------- résultats de recherche ---------- */
#results{position:fixed;z-index:9;top:calc(env(safe-area-inset-top, 0px) + 70px);left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));max-width:460px;box-sizing:border-box;
  max-height:calc(100% - env(safe-area-inset-top, 0px) - 86px);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
#results-in{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:transparent;padding:2px 12px}
#results .hint{padding:12px 2px 2px}

/* ---------- repères posés sur la carte ---------- */
.puck{width:34px;height:34px;display:grid;place-items:center}
.puck i{width:20px;height:20px;border-radius:50%;background:var(--puck);border:3.5px solid #fff;box-sizing:border-box;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.puck .ic{display:none;width:36px;height:36px;color:var(--puck);stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.puck.navi i{display:none}
.puck.navi .ic{display:block}
.puck.hdg:not(.navi)::before{content:"";position:absolute;top:-5px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom:9px solid var(--puck)}
.jpin{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.orgdot{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--asphalt);box-sizing:border-box;box-shadow:var(--shadow-s)}
.poi{width:30px;height:30px;border-radius:50%;background:var(--asphalt);color:#fff;border:2px solid #fff;box-sizing:border-box;display:grid;place-items:center;box-shadow:var(--shadow-s);cursor:pointer}
.poi .ic{width:16px;height:16px;stroke-width:2.2}
.poi.parking{background:var(--blue);border-radius:8px}
.poi.charge{background:var(--green)}
.poi b{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--ink);font:700 12.5px/1 var(--cond);padding:3px 5px;border-radius:5px;box-shadow:var(--shadow-s);white-space:nowrap}
.poi.best b{background:var(--green);color:#fff}
.poi.sel{display:none}
.repm{width:34px;height:31px;cursor:pointer;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.repm .sg{width:100%;height:100%}
.lbl{pointer-events:none;white-space:nowrap;color:var(--map-ink);text-shadow:0 0 2px var(--map-halo),0 0 2px var(--map-halo),0 0 4px var(--map-halo)}
.lbl.town{font:700 17px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase}
.lbl.village{font:700 13px/1 var(--cond);letter-spacing:.13em;text-transform:uppercase}
.lbl.street{font:500 11px/1 var(--font);color:var(--map-ink2)}
.lbl.green{font:600 11.5px/1 var(--font);color:var(--map-green)}
.lbl.water{font:italic 600 12px/1 var(--font);color:var(--map-water)}
.lbl.shield{font:700 12px/1 var(--cond);letter-spacing:.04em;padding:2px 5px;border-radius:3px;text-shadow:none;box-shadow:0 0 0 1.5px #fff}
.lbl.shield.a{background:#C1121C;color:#fff}
.lbl.shield.d{background:#F7B500;color:#15130B}
.lbl.shield.toll{background:var(--surface);color:var(--ink)}
.zmid .lbl.street,.zmid .lbl.green,.zmid .lbl.toll{display:none}
.zlo .lbl.village,.zlo .lbl.water,.zlo .lbl.shield{display:none}

@media (max-width:759px) and (min-height:521px), (max-width:559px){
  /* pendant le choix du trajet, la carte garde toute la place au-dessus de la feuille */
  #app[data-view="route"] #chips,#app[data-view="route"] #demoflag{display:none}
  /* liste de lieux : la carte garde plus de la moitié de l'écran pour que les pastilles restent lisibles */
  #app[data-view="pois"] #sheet{max-height:46%}
}
/* écran large, ou téléphone couché (même condition que WIDE dans app.js) */
@media (min-width:760px), (orientation:landscape) and (max-height:520px) and (min-width:560px){
  #sheet{left:max(16px, env(safe-area-inset-left, 0px));right:auto;bottom:16px;width:400px;border-radius:16px;max-height:calc(100% - 190px);box-shadow:var(--shadow)}
  #sheet-in{padding:14px 16px}
  /* le panneau occupe le coin bas gauche : compteur et mentions se rangent à sa droite */
  #speed{left:calc(max(16px, env(safe-area-inset-left, 0px)) + var(--sheet-w, 400px) + 16px);bottom:32px}
  #attrib{left:calc(max(16px, env(safe-area-inset-left, 0px)) + var(--sheet-w, 400px) + 16px);bottom:8px}
  #toast{bottom:28px}
}
/* téléphone couché : peu de hauteur, donc tout se tasse et se range sur les bords pour laisser la carte au milieu */
@media (orientation:landscape) and (max-height:520px) and (min-width:560px){
  #ui{padding-top:calc(env(safe-area-inset-top, 0px) + 8px)}
  #top{max-width:none;flex-direction:row;align-items:center;gap:10px}
  #searchbar{width:340px;flex:none;height:46px}
  #chips{flex:1;min-width:0;align-self:auto;margin:0 calc(-1 * var(--gr)) 0 0;padding:2px var(--gr) 2px 0}
  #sheet{width:340px;bottom:max(10px, env(safe-area-inset-bottom, 0px));max-height:calc(100% - 78px - env(safe-area-inset-top, 0px))}
  #sheet-in{padding:10px 14px}
  /* choix du trajet : « Démarrer » reste toujours sous le pouce, le reste défile au-dessus */
  .actions.go{position:sticky;bottom:-10px;margin:8px -14px -10px;padding:8px 14px 10px;background:var(--surface);box-shadow:0 -6px 10px -8px rgba(21,26,33,.35)}
  .sign{max-width:320px}
  #navsign .in{gap:10px;padding:5px 12px 6px 6px}
  #ns-arrow{width:44px;height:44px}
  #ns-dist{font-size:27px}
  #ns-act{font-size:15px;margin-top:0}
  #ns-road{font-size:16px;margin-top:0}
  .navon #sheet{width:auto;max-width:340px}
  .navbar{gap:14px}
  .navbar b{font-size:23px}
  .nb-main b{font-size:27px}
  .navbar span{font-size:12px}
  #speed{bottom:max(14px, env(safe-area-inset-bottom, 0px))}
  #speedo{width:56px;height:56px}
  #speedo b{font-size:23px}
  #limit{width:46px;height:46px;font-size:19px}
  #side{bottom:max(10px, env(safe-area-inset-bottom, 0px));gap:8px}
  .fab{width:44px;height:44px}
  #attrib{bottom:auto;top:calc(env(safe-area-inset-top, 0px) + 4px);left:auto;right:max(16px, env(safe-area-inset-right, 0px));max-width:46%}
  #app:not(.navon) #attrib{top:auto;bottom:4px;right:calc(max(16px, env(safe-area-inset-right, 0px)) + 56px)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="app" data-view="home" data-mode="boot">
  <div id="map" role="application" aria-label="Carte"></div>

  <div id="ui">
    <div id="top">
      <form id="searchbar" role="search" autocomplete="off">
        <button type="button" class="iconbtn" id="sb-lead" data-act="lead" aria-label="Lunavia"></button>
        <input id="q" type="search" enterkeyhint="search" placeholder="Où va-t-on ?" aria-label="Rechercher une adresse ou un lieu" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="iconbtn" id="sb-clear" data-act="clear" aria-label="Effacer la recherche" data-ic="close" hidden></button>
        <button type="button" class="iconbtn" id="sb-set" data-act="settings" aria-label="Réglages" data-ic="gear"></button>
      </form>
      <div id="chips" role="toolbar" aria-label="Lieux utiles"></div>
      <button type="button" id="demoflag" data-act="about" hidden><b>Démo</b><span>Val-Lunavia, ville fictive</span></button>
    </div>

    <div id="navsign" class="sign blue" hidden>
      <div class="in">
        <div id="ns-arrow"></div>
        <div class="ns-t"><div id="ns-dist"></div><div id="ns-act"></div><div id="ns-road"></div></div>
      </div>
    </div>
    <div id="ns-under"><div id="lanes" hidden></div><div id="ns-then" hidden></div></div>

    <div id="alert" class="sign yellow" hidden>
      <div class="in">
        <div id="al-ic"></div>
        <div class="al-t"><b id="al-title"></b><span id="al-sub"></span></div>
        <div class="al-b"><button type="button" data-act="al-yes">Toujours là</button><button type="button" data-act="al-no">Plus là</button></div>
      </div>
    </div>

    <div id="side">
      <button type="button" class="fab report" id="reportbtn" data-act="report" aria-label="Signaler un événement sur la route"></button>
      <button type="button" class="fab" id="layers" data-act="layers" aria-label="Changer de fond de carte" data-ic="layers"></button>
      <button type="button" class="fab" id="north" data-act="north" aria-label="Remettre le nord en haut" data-ic="north" hidden></button>
      <button type="button" class="fab" id="locate" data-act="locate" aria-label="Ma position" data-ic="locate"></button>
    </div>

    <div id="speed" hidden>
      <div id="limit" hidden></div>
      <div id="speedo"><b>0</b><span>km/h</span></div>
    </div>
    <div id="attrib"></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <div id="results" hidden><div id="results-in"></div></div>
  <section id="sheet" aria-label="Panneau d’action"><div id="sheet-in"></div></section>
</div>
<script src="vendor/maplibre-gl.js?v=4.7.1"></script>
<script>
/* ---------- Lunavia : outils géographiques, format des nombres, textes de guidage ---------- */
window.J = window.J || {};
J.geo = (function () {
  const R = 6371008.8, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;

  // distance en mètres entre deux points [lon, lat]
  function hav(a, b) {
    const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  // cap de a vers b, 0 = nord, 90 = est
  function bearing(a, b) {
    const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1]));
    const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0]));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  // écart signé b - a, entre -180 et 180
  const angDiff = (a, b) => ((b - a + 540) % 360) - 180;
  function smoothAngle(from, to, k) { return (from + angDiff(from, to) * k + 360) % 360; }

  function dest(p, brg, d) {
    const a = rad(brg), dr = d / R, la = rad(p[1]), lo = rad(p[0]);
    const la2 = Math.asin(Math.sin(la) * Math.cos(dr) + Math.cos(la) * Math.sin(dr) * Math.cos(a));
    const lo2 = lo + Math.atan2(Math.sin(a) * Math.sin(dr) * Math.cos(la), Math.cos(dr) - Math.sin(la) * Math.sin(la2));
    return [deg(lo2), deg(la2)];
  }
  function circle(c, r, n) {
    const ring = [];
    for (let i = 0; i <= (n || 40); i++) ring.push(dest(c, i * 360 / (n || 40), r));
    return ring;
  }
  function cum(geom) {
    const c = new Float64Array(geom.length);
    for (let i = 1; i < geom.length; i++) c[i] = c[i - 1] + hav(geom[i - 1], geom[i]);
    return c;
  }
  // polyline encodée (Valhalla : précision 6, OSRM : 5) -> [[lon, lat], ...]
  function decode(str, precision) {
    const f = Math.pow(10, precision || 6), out = [];
    let i = 0, lat = 0, lon = 0;
    while (i < str.length) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
      lat += (res & 1) ? ~(res >> 1) : (res >> 1);
      shift = 0; res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
      lon += (res & 1) ? ~(res >> 1) : (res >> 1);
      out.push([lon / f, lat / f]);
    }
    return out;
  }
  function encode(coords, precision) {
    const f = Math.pow(10, precision || 6);
    let out = '', plat = 0, plon = 0;
    const enc = v => { v = v < 0 ? ~(v << 1) : v << 1; let o = ''; while (v >= 32) { o += String.fromCharCode((32 | (v & 31)) + 63); v >>>= 5; } return o + String.fromCharCode(v + 63); };
    for (const c of coords) {
      const lat = Math.round(c[1] * f), lon = Math.round(c[0] * f);
      // les écarts dépassent 2^31 seulement au-delà de 2000 km d'un point au suivant : jamais sur une route
      out += enc(lat - plat) + enc(lon - plon); plat = lat; plon = lon;
    }
    return out;
  }
  // point de la ligne le plus proche de p, en cherchant sur les segments [from, to]
  function nearest(geom, c, p, from, to) {
    const kx = Math.cos(rad(p[1])) * 111320, ky = 110574;
    let best = { d: Infinity, i: 0, t: 0, s: 0, pt: geom[0] };
    from = Math.max(0, from | 0); to = Math.min(geom.length - 2, to == null ? geom.length - 2 : to | 0);
    for (let i = from; i <= to; i++) {
      const a = geom[i], b = geom[i + 1];
      const ax = (a[0] - p[0]) * kx, ay = (a[1] - p[1]) * ky, bx = (b[0] - p[0]) * kx, by = (b[1] - p[1]) * ky;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
      let t = l2 ? -(ax * dx + ay * dy) / l2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const d = Math.hypot(ax + dx * t, ay + dy * t);
      if (d < best.d) best = { d, i, t, s: c[i] + (c[i + 1] - c[i]) * t, pt: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t] };
    }
    return best;
  }
  // position à s mètres du début de la ligne
  function at(geom, c, s) {
    const n = geom.length;
    if (n < 2) return { pt: geom[0], i: 0, brg: 0 };
    s = Math.max(0, Math.min(c[n - 1], s));
    let lo = 0, hi = n - 2;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (c[m] <= s) lo = m; else hi = m - 1; }
    let i = lo;
    while (i < n - 2 && c[i + 1] - c[i] === 0) i++;
    const seg = c[i + 1] - c[i], t = seg ? (s - c[i]) / seg : 0, a = geom[i], b = geom[i + 1];
    return { pt: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], i, brg: bearing(a, b) };
  }
  function bounds(geom) {
    let w = 180, s = 90, e = -180, n = -90;
    for (const p of geom) { if (p[0] < w) w = p[0]; if (p[0] > e) e = p[0]; if (p[1] < s) s = p[1]; if (p[1] > n) n = p[1]; }
    return [[w, s], [e, n]];
  }
  return { hav, bearing, angDiff, smoothAngle, dest, circle, cum, decode, encode, nearest, at, bounds, rad, deg };
})();

/* ---------- nombres et durées à la française ---------- */
J.fmt = (function () {
  const dec = (n, d) => n.toFixed(d).replace('.', ',');
  function dist(m) {
    if (!isFinite(m)) return '';
    if (m < 30) return Math.max(5, Math.round(m / 5) * 5) + ' m';
    if (m < 300) return Math.round(m / 10) * 10 + ' m';
    if (m < 950) return Math.round(m / 50) * 50 + ' m';
    if (m < 9950) return dec(m / 1000, 1) + ' km';
    return Math.round(m / 1000) + ' km';
  }
  function dur(s) {
    const min = Math.max(1, Math.round(s / 60));
    if (min < 60) return min + ' min';
    const h = Math.floor(min / 60), r = min % 60;
    return h + ' h ' + (r < 10 ? '0' : '') + r;
  }
  function clock(d) { return d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }
  function ago(t) {
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return 'à l’instant';
    if (m < 60) return 'il y a ' + m + ' min';
    const h = Math.round(m / 60);
    return h < 24 ? 'il y a ' + h + ' h' : 'il y a ' + Math.round(h / 24) + ' j';
  }
  const euro = (v, d) => dec(v, d == null ? 2 : d) + ' €';
  // distance dite à voix haute
  function say(m) {
    if (m < 950) { const v = m < 300 ? Math.max(10, Math.round(m / 10) * 10) : Math.round(m / 50) * 50; return v + ' mètres'; }
    const km = Math.round(m / 100) / 10;
    if (km === 1) return 'un kilomètre';
    return (km < 10 ? dec(km, km % 1 ? 1 : 0) : Math.round(km)) + (km < 2 ? ' kilomètre' : ' kilomètres');
  }
  return { dec, dist, dur, clock, ago, euro, say };
})();

/* ---------- textes de guidage en français ---------- */
J.fr = (function () {
  const ord = n => (n === 1 ? '1re' : n + 'e');
  const ordSay = n => ['', 'première', 'deuxième', 'troisième', 'quatrième', 'cinquième', 'sixième', 'septième', 'huitième'][n] || (n + 'e');
  const side = s => (s.mod && s.mod.indexOf('left') >= 0 ? 'gauche' : s.mod && s.mod.indexOf('right') >= 0 ? 'droite' : '');
  const LE = ['boulevard', 'chemin', 'quai', 'cours', 'passage', 'square', 'pont', 'sentier', 'faubourg', 'rond-point', 'carrefour', 'parvis', 'mail', 'viaduc', 'tunnel', 'périphérique', 'clos', 'lotissement', 'hameau', 'domaine', 'parc', 'port', 'giratoire', 'contournement'];
  const LA = ['rue', 'route', 'place', 'voie', 'rocade', 'ruelle', 'traverse', 'chaussée', 'montée', 'côte', 'promenade', 'villa', 'cité', 'résidence', 'bretelle', 'corniche', 'levée', 'venelle', 'descente', 'rampe', 'passerelle', 'digue', 'déviation', 'pénétrante'];
  const LAP = ['avenue', 'allée', 'impasse', 'esplanade', 'autoroute', 'ancienne', 'ancien'];
  // le nom d'une voie avec son article : « la rue Voltaire », « l’A 6 », « le boulevard Victor-Hugo ». Un nom inconnu reste tel quel.
  function road(name) {
    const n = String(name || '').trim();
    if (!n) return '';
    if (/^[AE]\s?\d/.test(n)) return 'l’' + n;
    if (/^(D|N|M|RD|RN|RM|C|VC|T)\s?\d/.test(n)) return 'la ' + n;
    const w = (n.match(/^(rond-point|[^\s’'-]+)/i) || [''])[0].toLowerCase(), low = n.charAt(0).toLowerCase() + n.slice(1);
    if (w === 'grande' || w === 'grand') return 'la ' + n;
    if (LE.indexOf(w) >= 0) return 'le ' + low;
    if (LA.indexOf(w) >= 0) return 'la ' + low;
    if (LAP.indexOf(w) >= 0) return 'l’' + low;
    return n;
  }
  const on = s => (s.name ? ' sur ' + road(s.name) : '');
  const toward = s => (s.dest ? ' vers ' + road(s.dest) : s.name ? ' vers ' + road(s.name) : '');
  const CARD = ['le nord', 'le nord-est', 'l’est', 'le sud-est', 'le sud', 'le sud-ouest', 'l’ouest', 'le nord-ouest'];
  const card = brg => CARD[Math.round((((brg % 360) + 360) % 360) / 45) % 8];

  // libellé court pour le panneau (sans le nom de la rue)
  function act(s) {
    const sd = side(s);
    switch (s.type) {
      case 'depart': return 'Partez';
      case 'arrive': return 'Arrivée';
      case 'roundabout': return s.exit ? 'Rond-point, ' + ord(s.exit) + ' sortie' : 'Prenez le rond-point';
      case 'rexit': return 'Sortez du rond-point';
      case 'ramp': return 'Prenez la bretelle' + (sd ? ' à ' + sd : '');
      case 'exit': return (s.num ? 'Sortie ' + s.num : 'Prenez la sortie') + (sd ? ' à ' + sd : '');
      case 'merge': return 'Rejoignez la voie';
      case 'fork': return sd ? 'Restez à ' + sd : 'Continuez tout droit';
      case 'end': return 'Au bout, tournez à ' + (sd || 'droite');
      case 'continue': return 'Continuez';
      case 'ferry': return 'Prenez le ferry';
      case 'note': return s.text || 'Continuez';
    }
    switch (s.mod) {
      case 'uturn': return 'Faites demi-tour';
      case 'sharp-left': return 'Tournez franchement à gauche';
      case 'sharp-right': return 'Tournez franchement à droite';
      case 'slight-left': return 'Serrez à gauche';
      case 'slight-right': return 'Serrez à droite';
      case 'left': return 'Tournez à gauche';
      case 'right': return 'Tournez à droite';
    }
    return 'Continuez tout droit';
  }
  // phrase complète (feuille de route et voix)
  function text(s, spoken) {
    const sd = side(s);
    switch (s.type) {
      case 'depart': return 'Partez' + (s.card ? ' vers ' + s.card : '') + on(s);
      case 'arrive': return 'Vous êtes arrivé' + (sd ? ', votre destination est à ' + sd : '');
      case 'roundabout': return s.exit ? 'Au rond-point, prenez la ' + (spoken ? ordSay(s.exit) : ord(s.exit)) + ' sortie' + on(s) : 'Engagez-vous dans le rond-point';
      case 'rexit': return 'Sortez du rond-point' + on(s);
      case 'ramp': return 'Prenez la bretelle' + (sd ? ' à ' + sd : '') + toward(s);
      case 'exit': return 'Prenez la sortie' + (s.num ? ' ' + s.num : '') + (sd ? ' à ' + sd : '') + toward(s);
      case 'merge': return s.name ? 'Rejoignez ' + road(s.name) : 'Insérez-vous dans la circulation';
      case 'fork': return (sd ? 'Restez à ' + sd : 'Continuez tout droit') + (s.dest ? ' vers ' + road(s.dest) : on(s));
      case 'end': return 'Au bout de la route, tournez à ' + (sd || 'droite') + on(s);
      case 'continue': return s.name ? 'Continuez sur ' + road(s.name) : 'Continuez tout droit';
      case 'ferry': return 'Prenez le ferry';
      case 'note': return s.text || 'Continuez';
    }
    return (s.mod === 'straight' || !s.mod) ? (s.name ? 'Continuez sur ' + road(s.name) : 'Continuez tout droit') : act(s) + on(s);
  }
  const lower = t => (t ? t.charAt(0).toLowerCase() + t.slice(1) : t);
  return { act, text, ord, lower, road, card };
})();

/* ---------- mise en forme commune d'un itinéraire (ville de démo, Valhalla ou OSRM) ---------- */
J.mkRoute = function (o) {
  const G = J.geo, c = G.cum(o.geom), n = o.geom.length, dist = c[n - 1];
  let steps = (o.steps || []).filter(s => s && isFinite(s.idx));
  steps.forEach(s => { s.idx = Math.max(0, Math.min(n - 1, s.idx | 0)); s.s0 = c[s.idx]; });
  steps.sort((a, b) => a.idx - b.idx);
  // cap suivi par le tracé entre deux distances depuis le départ
  const brg = (a, b) => { a = Math.max(0, Math.min(dist, a)); b = Math.max(0, Math.min(dist, b)); return b - a < 0.5 ? null : G.bearing(G.at(o.geom, c, a).pt, G.at(o.geom, c, b).pt); };
  // une route qui change de nom en ligne droite n'est pas une manœuvre : l'étape se fond dans la précédente
  const kept = [];
  steps.forEach(s => {
    const b0 = brg(s.s0 - 22, s.s0 - 2), b1 = brg(s.s0 + 2, s.s0 + 22), turn = b0 != null && b1 != null ? Math.abs(G.angDiff(b0, b1)) : 0;
    if (s.type === 'continue' && turn < 30 && kept.length) { kept[kept.length - 1].time = (kept[kept.length - 1].time || 0) + (s.time || 0); return; }
    kept.push(s);
  });
  steps = kept;
  if (!steps.length || steps[0].type !== 'depart') steps.unshift({ type: 'depart', mod: 'straight', name: '', idx: 0, s0: 0, time: 0 });
  if (steps[steps.length - 1].type !== 'arrive') steps.push({ type: 'arrive', mod: '', name: '', idx: n - 1, s0: dist, time: 0 });
  steps[steps.length - 1].idx = n - 1; steps[steps.length - 1].s0 = dist;
  const time = o.time > 0 ? o.time : dist / 12;
  let known = 0;
  steps.forEach((s, i) => { s.len = (i + 1 < steps.length ? steps[i + 1].s0 : dist) - s.s0; known += s.time > 0 ? s.time : 0; });
  if (known < time * 0.5) steps.forEach(s => { s.time = dist ? time * s.len / dist : 0; });
  steps.forEach((s, i) => {
    if (s.type === 'depart') { const b = brg(0, Math.min(dist, 40)); if (b != null) s.card = J.fr.card(b); return; }
    // angle du virage : pour un rond-point, entre la route d'arrivée et la route de sortie
    const out = s.type === 'roundabout' && steps[i + 1] && steps[i + 1].type === 'rexit' ? steps[i + 1].s0 : s.s0;
    const b0 = brg(s.s0 - 22, s.s0 - 2), b1 = brg(out + 2, out + 22);
    s.ang = b0 != null && b1 != null ? G.angDiff(b0, b1) : null;
  });
  let acc = 0;
  for (let i = steps.length - 1; i >= 0; i--) {
    const s = steps[i];

    else if (!s.say) s.say = s.text;
  }
  const k = acc > 0 ? time / acc : 1; // les temps d'étape sont recalés sur la durée totale
  steps.forEach(s => { s.time *= k; s.tAfter *= k; });
  return { geom: o.geom, cum: c, dist, time, steps, toll: !!o.toll, highway: !!o.highway, ferry: !!o.ferry, src: o.src || '', limits: o.limits || null };
};

/* flèche de manœuvre dessinée d'après l'angle du virage */
J.arrow = function (s) {
  const open = '<svg class="mv" viewBox="0 0 48 48" aria-hidden="true">';
  if (s.type === 'arrive') return open + '<path d="M15 43V7M15 8.500h20l-5.500 7 5.500 7H15"/></svg>';
  if (s.type === 'roundabout' || s.type === 'rexit') {
    // la sortie est dessinée dans sa vraie direction quand le tracé la donne ; sinon d'après son numéro
    let a = s.type === 'rexit' ? 55 : typeof s.ang === 'number' ? s.ang : ({ 1: 90, 2: 0, 3: -90 })[s.exit] || 0;
    if (s.type === 'roundabout') a = Math.abs(a) > 160 ? 180 : Math.round(a / 15) * 15;
    const r = a * Math.PI / 180;
    const x1 = 24 + 9 * Math.sin(r), y1 = 24 - 9 * Math.cos(r), x2 = 24 + 19 * Math.sin(r), y2 = 24 - 19 * Math.cos(r);
    return open + '<circle cx="24" cy="24" r="9"/><path d="M24 45V33"/><path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + 'L' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"/>' + head(x2, y2, r) +
      (s.exit ? '<text x="24" y="28.400" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">' + s.exit + '</text>' : '') + '</svg>';
  }
  if (s.mod === 'uturn') return open + '<path d="M16 43V19a8.500 8.500 0 0 1 17 0v12"/>' + head(33, 32, Math.PI) + '</svg>';
  const soft = s.type === 'ramp' || s.type === 'exit' || s.type === 'fork' || s.type === 'merge';
  const left = s.mod && s.mod.indexOf('left') >= 0, right = s.mod && s.mod.indexOf('right') >= 0;
  let a = ({ 'slight-right': 40, right: 90, 'sharp-right': 135, 'slight-left': -40, left: -90, 'sharp-left': -135 })[s.mod] || 0;
  if (soft) a = left ? -40 : right ? 40 : 0;
  if (s.type === 'depart' || s.type === 'continue') a = 0;
  const r = a * Math.PI / 180, x = 24 + 15 * Math.sin(r), y = 27 - 15 * Math.cos(r);
  return open + '<path d="M24 43V27L' + x.toFixed(1) + ' ' + y.toFixed(1) + '"/>' + head(x, y, r) + '</svg>';

  function head(x, y, r) {
    const dx = -Math.sin(r), dy = Math.cos(r), w = 9.500, c = Math.cos(0.560), sn = Math.sin(0.560);
    const ax = x + w * (dx * c - dy * sn), ay = y + w * (dx * sn + dy * c), bx = x + w * (dx * c + dy * sn), by = y + w * (-dx * sn + dy * c);
    return '<path d="M' + ax.toFixed(1) + ' ' + ay.toFixed(1) + 'L' + x.toFixed(1) + ' ' + y.toFixed(1) + 'L' + bx.toFixed(1) + ' ' + by.toFixed(1) + '"/>';
  }
};

/* ---------- Lunavia : ville de démonstration (Val-Lunavia), générée sur place, sans aucune donnée réseau ----------
   Sert quand la carte en ligne est inaccessible (aperçu dans Claude) : même interface, mêmes fonctions,
   mais sur une petite ville fictive avec son réseau de rues, son calcul d'itinéraire et ses lieux. */
J.demo = (function () {
  const G = J.geo;
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

  function build() {
    const LAT0 = 46.1612, LON0 = 2.7045, MY = 110574, MX = 111320 * Math.cos(G.rad(LAT0));
    const ll = (x, y) => [+(LON0 + x / MX).toFixed(6), +(LAT0 + y / MY).toFixed(6)];
    const warp = (x, y) => [x + 38 * Math.sin(y / 520 + 0.6) + 22 * Math.sin((x + y) / 410), y + 34 * Math.sin(x / 470 + 1.1) + 18 * Math.sin((x - y) / 380)];
    const W = (x, y) => { const w = warp(x, y); return ll(w[0], w[1]); };
    let seed = 20261110;
    const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    const nodes = [], edges = [], keys = new Map(), feats = [];
    const F = (k, type, coords, props) => feats.push({ type: 'Feature', properties: Object.assign({ k }, props || {}), geometry: { type, coordinates: coords } });
    function node(x, y, key) {
      if (key && keys.has(key)) return keys.get(key);
      const id = nodes.length; nodes.push({ id, x, y, ll: ll(x, y), adj: [] });
      if (key) keys.set(key, id);
      return id;
    }
    function edge(a, b, p) {
      const A = nodes[a], B = nodes[b];
      const e = Object.assign({ a, b, len: Math.hypot(A.x - B.x, A.y - B.y), name: '', cls: 'residential', speed: 50, toll: false }, p);
      edges.push(e); A.adj.push(edges.length - 1); B.adj.push(edges.length - 1);
      return e;
    }
    // quadrillage de rues légèrement ondulé ; chaque tronçon entre deux carrefours est coupé en 4
    function grid(tag, cx, cy, nx, ny, sp, prop, skipV) {
      const SUB = 4, x0 = cx - (nx - 1) * sp / 2, y0 = cy - (ny - 1) * sp / 2;
      const at = (gx, gy) => { const w = warp(x0 + gx * sp / SUB, y0 + gy * sp / SUB); return node(w[0], w[1], tag + ':' + gx + ',' + gy); };
      for (let j = 0; j < ny; j++) for (let g = 0; g < (nx - 1) * SUB; g++) edge(at(g, j * SUB), at(g + 1, j * SUB), prop('h', j, Math.floor(g / SUB)));
      for (let i = 0; i < nx; i++) for (let g = 0; g < (ny - 1) * SUB; g++) {
        const j = Math.floor(g / SUB);
        if (skipV && skipV(i, j)) continue;
        edge(at(i * SUB, g), at(i * SUB, g + 1), prop('v', i, j));
      }
      return { tag, x0, y0, sp, nx, ny, at, P: (i, j, dx, dy) => W(x0 + i * sp + (dx || 0), y0 + j * sp + (dy || 0)) };
    }

      const r = [];
      for (let x = x0; x < x1; x += step) r.push(W(x, y0));
      for (let y = y0; y < y1; y += step) r.push(W(x1, y));
      for (let x = x1; x > x0; x -= step) r.push(W(x, y1));
      for (let y = y1; y > y0; y -= step) r.push(W(x0, y));

  /* ---------- position : GPS réel ou trajet simulé ---------- */

  function startGPS(user) {

    const kmh = Math.round((f.speed || 0) * 3.6), now = Date.now(), n = S.nav;
    $('#speedo b').textContent = kmh;
    const whole = n && n.travel === 'car' && P.limits && (n.limFail || 0) < 2; // limitations demandées pour tout le trajet

  function limitAt(n) {

  /* ---------- signalements ---------- */

  /* ---------- recherche ---------- */

  /* ---------- itinéraires ---------- */
  function labelRoutes() {
    const R = S.routes;

    R.forEach((r, i) => { r.tag = ''; r.tagc = ''; if (r.time < R[fast].time) fast = i; if (r.dist < R[short].dist) short = i; });
    const anyToll = R.some(r => r.toll);

      else if (anyToll && !r.toll) r.tag = 'Sans péage';
      else if (i === short && r.dist < R[fast].dist * 0.95) r.tag = 'Le plus court';
      else r.tag = 'Autre trajet';
    });
  }
  function drawRoutes(fit) {
    const sel = S.routes[S.sel];
    if (!sel) { setSrc('route', EMPTY); setSrc('alts', EMPTY); return; }
    setSrc('alts', { type: 'FeatureCollection', features: S.routes.map((r, i) => (i === S.sel ? null : line(r.geom, { i }))).filter(Boolean) });
    setSrc('route', { type: 'FeatureCollection', features: [line(sel.geom)] });

      let b = null;
      const grow = x => { b = b ? [[Math.min(b[0][0], x[0][0]), Math.min(b[0][1], x[0][1])], [Math.max(b[1][0], x[1][0]), Math.max(b[1][1], x[1][1])]] : x; };
      S.routes.forEach(r => grow(G.bounds(r.geom)));
      // le repère d'arrivée et le point de départ peuvent être à l'écart de la route : ils restent dans le cadre
      if (S.dest) grow([S.dest.ll, S.dest.ll]);
      const o = S.origin ? S.origin.ll : S.pos && S.pos.ll;
      if (o) grow([o, o]);
      requestAnimationFrame(() => { try { map.fitBounds(b, { padding: pad(), duration: 900, bearing: 0, pitch: 0, maxZoom: 16.5, essential: true }); } catch (e) { /* écran trop petit pour le cadrage */ } });
    }
  }
  function clearRoute() { S.routes = []; S.sel = 0; setSrc('route', EMPTY); setSrc('alts', EMPTY); }
  async function plan(dest) {
    S.dest = dest; S.routes = []; S.sel = 0; S.routeErr = null;
    const from = S.origin ? S.origin.ll : S.pos && S.pos.ll, seq = ++S.routeSeq;
    setDest(dest.ll); unfollow();
    setSrc('route', EMPTY); setSrc('alts', EMPTY);
    if (!from) { S.loading = false; S.routeErr = 'nopos'; go('route'); if (S.mode === 'live') startGPS(true); return; }
    S.loading = true; go('route');
    const opts = routeOpts(), mode = S.travel;
    S.wx = null;
    try {
      const rs = await P.route(from, dest.ll, mode, opts);
      if (seq !== S.routeSeq) return;
      S.routes = rs.slice(0, 3); S.loading = false;
      labelRoutes(); render(); drawRoutes(true);
      if (P.weather) P.weather(dest.ll, Date.now() + rs[0].time * 1000).then(w => { if (seq === S.routeSeq) { S.wx = w; wxUI(); } }).catch(() => { /* pas de météo : rien d'affiché */ });
      if (S.mode === 'live' && mode === 'car' && !opts.avoidTolls && rs[0].toll && !S.routes.some(r => !r.toll)) {
        P.route(from, dest.ll, 'car', Object.assign({}, opts, { avoidTolls: true })).then(r2 => {
          if (seq !== S.routeSeq || S.view !== 'route' || !r2[0] || r2[0].toll) return;
          S.routes = S.routes.slice(0, 2).concat([r2[0]]);
          labelRoutes(); render(); wxUI(); drawRoutes(false);
        }).catch(() => { /* pas de variante sans péage */ });
      }
    } catch (e) {

  }
  // réglages du calcul : péages, autoroutes, et les routes que tu as signalées fermées
  function routeOpts(extra) {

  }
  function wxUI() {

  function vRoute() {

  }

  /* ---------- guidage ---------- */
  const sayText = s => s.say || s.text;
  function startNav(sim) {
    const r = S.routes[S.sel];
    if (!r) return;
    clearPois(); S.poi = null; chipsUI();
    S.nav = { route: r, s: 0, seg: 0, k: 0, off: 0, said: {}, t0: Date.now(), lastRe: 0, cam: null, z: null, zLock: null, reps: [], alerted: {}, simulated: !!sim, dest: S.dest, travel: S.travel, ui: -2 };
    indexReports();

    S.follow = true;
    if (sim) startSim(r); // avant l'affichage : la barre « Trajet simulé » en dépend
    go('nav');
    wake(true);
    const first = r.steps[0], nx = r.steps[1];
    say('C’est parti. ' + sayText(first) + (nx && nx.s0 > 60 && nx.type !== 'arrive' ? '. Puis, dans ' + F.say(nx.s0) + ', ' + fr.lower(sayText(nx)) : ''), true);
    if (nx) S.nav.said['f1'] = 1; // la première manœuvre vient d'être annoncée
    if (!sim && S.pos) navUpdate(S.pos);
  }
  function endNav() {
    stopSim(); wake(false);
    if (S.pos) S.pos.speed = 0;
    S.nav = null; S.limit = null; limitUI();
    setAlert(null);
    $('#navsign').hidden = true; $('#ns-then').hidden = true; $('#lanes').hidden = true; $('#speed').hidden = true;
    drawPuck();
    map.easeTo({ pitch: 0, bearing: 0, duration: 600, essential: true });
  }
  async function reroute(f) {
    const n = S.nav;
    n.lastRe = Date.now(); n.off = 0;
    toast('Nouvel itinéraire…');
    try {
      const rs = await P.route(f.ll, n.dest.ll, n.travel, routeOpts({ heading: (f.speed || 0) > 3 && typeof f.heading === 'number' ? f.heading : undefined }));
      if (S.nav !== n || !rs[0]) return;
      n.route = rs[0]; n.s = 0; n.seg = 0; n.k = 0; n.said = {}; n.ui = -2;
      n.lim = null; n.limTo = null; n.li = 0; n.limFail = 0;
      S.routes = [rs[0]]; S.sel = 0;
      indexReports();
      setSrc('route', { type: 'FeatureCollection', features: [line(rs[0].geom)] });
      setGrad(0, true);
      say('Nouvel itinéraire', true);
    } catch (e) { toast('Impossible de recalculer pour le moment.'); }
  }
  function navUpdate(f) {
    const n = S.nav, r = n.route, g = r.geom;
    let m = G.nearest(g, r.cum, f.ll, n.seg - 4, n.seg + 45);
    if (m.d > 60) { const m2 = G.nearest(g, r.cum, f.ll, 0, g.length - 2); if (m2.d < m.d - 15) m = m2; }
    const on = f.sim || m.d <= Math.max(45, Math.min(90, (f.acc || 0) * 1.3));
    if (on) { n.off = 0; n.seg = m.i; n.s = m.s; f.show = m.pt; f.heading = G.at(g, r.cum, Math.min(r.dist, n.s + 5)).brg; ensureLimits(n); }
    else { f.show = null; if (++n.off >= 3 && Date.now() - n.lastRe > 12000) reroute(f); }

    const changed = k !== n.k;
    n.k = k;
    const cur = r.steps[k], nx = r.steps[k + 1], dn = nx ? Math.max(0, nx.s0 - n.s) : 0;

    n.tRem = cur.tAfter + cur.time * (cur.len > 0 ? Math.max(0, 1 - (n.s - cur.s0) / cur.len) : 0);
    n.next = nx; n.dn = dn;
    if (!nx || n.rem < 18 || (n.rem < 40 && !f.sim && (f.speed || 0) < 1.2)) { arrive(); return; }
    const v = f.speed || 0, far = v < 8.5 ? 150 : v < 15 ? 300 : v < 25 ? 500 : 1000, near = Math.max(30, v * 4), key = k + 1;
    if (nx.type === 'arrive') { if (dn <= far && !n.said['f' + key]) { n.said['f' + key] = 1; if (dn > 60) say('Dans ' + F.say(dn) + ', vous arrivez à destination'); } }
    else if (dn <= near && !n.said['n' + key] && !(n.hold > Date.now() && dn > 12)) {
      n.said['n' + key] = n.said['f' + key] = 1;
      // dans un petit rond-point, « sortez » couperait l'annonce qu'on vient de faire : le panneau suffit
      if (!(nx.type === 'rexit' && cur.type === 'roundabout' && cur.len < 120)) {
        const then = r.steps[k + 2];
        let t = sayText(nx);
        // deux manœuvres qui se suivent de près sont annoncées d'un seul souffle
        if (then && nx.len < 110 && nx.type !== 'roundabout' && then.type !== 'continue' && then.type !== 'note' && then.type !== 'rexit') { t += ', puis ' + (then.type === 'arrive' ? 'vous arrivez à destination' : fr.lower(fr.act(then))); n.said['f' + (key + 1)] = 1; n.hold = Date.now() + 4200; }
        say(t, true);

  }
  function navUI() {

  function arrive() {

  }
  function vNav() {
    const on = db.set.voice;

      (S.sim ? '<div class="simbar"><span>Trajet simulé</span><button type="button" class="chip sm" data-act="sim-pause" aria-pressed="' + S.sim.paused + '">' + ic(S.sim.paused ? 'play' : 'pause') + (S.sim.paused ? 'Reprendre' : 'Pause') + '</button><button type="button" class="chip sm" data-act="sim-speed">Vitesse ×' + S.sim.mult + '</button></div>' : '');

  /* ---------- lieux utiles ---------- */
  function clearPois() { M.pois.forEach(m => m.remove()); M.pois = []; }
  function markSel() { const p = S.view === 'place' || S.view === 'route' ? S.place : null; M.pois.forEach(m => m.getElement().classList.toggle('sel', !!p && m._p === p)); }
  function chipsUI() { document.querySelectorAll('#chips .chip').forEach(c => c.setAttribute('aria-pressed', String(!!S.poi && S.poi.cat === c.dataset.k))); }
  const priceOf = p => (p.extra && p.extra.prices && p.extra.prices[db.set.fuel]) || 0;
  function sortPois() {
    const po = S.poi, ref = S.pos ? S.pos.ll : po.center;
    po.best = 0;
    if (po.cat === 'fuel') po.items.forEach(p => { const v = priceOf(p); if (v && (!po.best || v < po.best)) po.best = v; });
    po.items.sort((a, b) => ((priceOf(a) || 99) - (priceOf(b) || 99)) * (po.cat === 'fuel' ? 1 : 0) || G.hav(ref, a.ll) - G.hav(ref, b.ll));
  }
  function drawPois() {

      const v = po.cat === 'fuel' ? priceOf(p) : 0;

  async function showPois(cat) {

    // autour de toi tant que ta position est à l'écran ; sinon autour de l'endroit que tu regardes
    let around = center(), mine = false;

  /* ---------- démarrage ---------- */
  function bind() {
    document.addEventListener('click', e => {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el || el.disabled) return;
      const fn = ACT[el.dataset.act];
      if (fn) fn(el, e);
    });
    document.addEventListener('change', e => {
      const t = e.target, k = t && t.dataset ? t.dataset.set : null;
      if (!k) return;
      if (t.type === 'checkbox') db.set[k] = t.checked;
      else if (t.type === 'number') { const v = parseFloat(String(t.value).replace(',', '.')); if (v >= +t.min && v <= +t.max) db.set[k] = v; else t.value = db.set[k]; }
      else db.set[k] = t.value;
      save();
    });
    $('#searchbar').addEventListener('submit', e => e.preventDefault());
    input.addEventListener('focus', () => { if (S.view !== 'search') { S.prev = S.view; go('search'); } });
    input.addEventListener('input', () => {
      S.q = input.value;
      $('#sb-clear').hidden = !S.q;
      clearTimeout(searchT);
      const q = S.q.trim();
      searchSeq++;
      if (q.length < 2) { S.results = null; renderResults(); return; }
      S.results = null; renderResults();
      searchT = setTimeout(() => runSearch(q), 260);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (S.results && S.results[0]) choose(S.results[0]); }
      else if (e.key === 'Escape') exitSearch();
    });
    // Téléphone tourné : on recale tout (panneaux, carte). Sur iPhone, une appli installée peut garder l'ancienne
    // géométrie quelques instants après la rotation, et les boutons ne répondent plus là où on les voit : on recale donc
    // plusieurs fois de suite, et on remet la page tout en haut.
    const settle = () => { syncInsets(); try { window.scrollTo(0, 0); } catch (e) { /* rien */ } if (map) { try { map.resize(); } catch (e) { /* carte pas prête */ } } };
    const turned = () => { settle(); setTimeout(settle, 350); setTimeout(settle, 1000); };
    window.addEventListener('resize', turned);
    window.addEventListener('orientationchange', turned);
    if (WIDE.addEventListener) WIDE.addEventListener('change', turned);
    // « Arrêter » doit toujours répondre : si le toucher n'est pas suivi du clic habituel, on arrête quand même
    document.addEventListener('touchend', e => {
      const el = e.target && e.target.closest ? e.target.closest('[data-act="stop"]') : null;
      if (!el) return;
      const t = setTimeout(() => ACT.stop(), 450);
      document.addEventListener('click', () => clearTimeout(t), { once: true, capture: true });
    }, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(syncInsets).observe(sheet);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.nav) wake(true); });
    const themed = () => { setBase(); };
    if (mq) { if (mq.addEventListener) mq.addEventListener('change', themed); else if (mq.addListener) mq.addListener(themed); }
    if (window.MutationObserver) new MutationObserver(themed).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    try { if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } } catch (e) { /* pas de voix */ }
  }
  function ready() {
    attrib(); zoomClasses(); northUI();
    if (S.mode === 'demo') {
      D.labels.forEach(l => mk(esc(l.text), 'lbl ' + l.cls, l.rot != null ? { rotation: l.rot, rotationAlignment: 'map', pitchAlignment: 'map' } : {}).setLngLat(l.ll).addTo(map));
      onFix({ ll: D.start.ll, acc: 5, speed: 0, heading: D.start.heading, t: Date.now(), sim: true }, true);
      // premier cadrage : la position de départ et le centre-ville dans la partie visible
      map.easeTo({ center: [(D.start.ll[0] + D.center[0]) / 2, (D.start.ll[1] + D.center[1]) / 2], zoom: WIDE.matches ? 14.6 : 14.1, offset: off(), duration: 0 });
    } else {
      startGPS(false);
      openShared();
    }
    drawReports(); drawParked();
  }
  // lien partagé « ?p=latitude,longitude,nom » : le lieu s'ouvre directement
  function openShared() {
    let v = null;
    try { v = new URLSearchParams(location.search).get('p'); } catch (e) { return; }
    const m = v && v.match(/^(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)(?:,(.*))?$/);
    if (!m) return;
    const lat = +m[1], lon = +m[2];
    if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180)) return;
    const p = { id: 'x' + lat + ',' + lon, name: (m[3] || 'Lieu partagé').slice(0, 60), sub: lat.toFixed(5) + ', ' + lon.toFixed(5), ll: [lon, lat], kind: 'pin', cat: 'address', extra: {} };
    map.jumpTo({ center: p.ll, zoom: 15.5 });
    S.follow = false;
    openPlace(p, true);
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* adresse inchangée */ }
  }
  // l'aperçu dans Claude interdit tout accès au réseau : ce blocage se reconnaît à son signalement, ou à un refus immédiat
  let cspSeen = false;
  document.addEventListener('securitypolicyviolation', () => { cspSeen = true; });
  async function boot() {
    document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = ic(el.dataset.ic); });
    $('#sb-lead').innerHTML = J.logo;
    $('#reportbtn').innerHTML = J.signs.danger;
    $('#chips').innerHTML = CATS.map(c => '<button type="button" class="chip" data-act="cat" data-k="' + c.id + '" aria-pressed="false">' + ic(c.icon) + c.label + '</button>').join('');
    db = load();
    bind();
    if (!window.maplibregl) { fail('La carte n’a pas pu se charger. Vérifie ta connexion, puis réessaie.'); return; }
    let st = null;
    const forced = /demo/i.test(location.hash);
    if (!forced) {
      const t0 = Date.now();
      try { st = await J.live.style('liberty'); } catch (e) { st = null; }
      if (st && isDark()) { try { st = await J.live.style('dark'); } catch (e) { /* on garde le fond clair */ } }
      if (!st) {
        const quick = Date.now() - t0 < 600;
        await new Promise(r => setTimeout(r, 60)); // laisse le temps au signalement de blocage d'arriver
        const viewer = cspSeen || !!window.claude;
        if (!viewer && !(quick && navigator.onLine !== false)) { fail('Impossible de joindre la carte en ligne. Vérifie ta connexion, puis réessaie.', true); return; }
        S.demoWhy = viewer ? 'policy' : 'guess';
      }
    } else S.demoWhy = 'asked';
    S.mode = st ? 'live' : 'demo';
    app.dataset.mode = S.mode;
    if (S.mode === 'demo' && S.demoWhy === 'policy' && HOME) $('#demoflag span').textContent = 'Voir la vraie carte';
    let c0, z0;
    if (S.mode === 'demo') {
      D = J.demo.build(); P = D.provider;
      db = { home: D.home, work: D.work, favs: [], recents: D.recents.slice(), reports: D.reports.slice(), parked: null, last: null, set: Object.assign({}, DEFSET) };
      st = D.style(isDark()); c0 = D.center; z0 = D.zoom;
    } else {
      P = J.live;
      db.reports = activeReports();
      c0 = db.last || [2.45, 46.6]; z0 = db.last ? 13.5 : 5.2;
    }
    try {
      map = new maplibregl.Map({ container: 'map', style: st, center: c0, zoom: z0, attributionControl: false, maxPitch: 62, fadeDuration: 120 });
    } catch (e) { fail('Cet appareil ne peut pas afficher la carte.'); return; }
    let started = false;
    const first = () => { if (started) return; started = true; ready(); };
    map.on('style.load', () => { overlays(); first(); });
    map.once('load', first);
    map.on('rotate', northUI); map.on('pitch', northUI); map.on('zoom', zoomClasses);
    ['dragstart', 'rotatestart', 'pitchstart'].forEach(ev => map.on(ev, e => { if (e.originalEvent) unfollow(); }));
    map.on('zoomend', e => { if (e.originalEvent && S.nav) S.nav.zLock = map.getZoom(); });
    map.on('click', onMapClick);
    map.on('error', () => { /* tuile ou police manquante : la carte continue */ });
    render();
  }
  J.app = { S, get map() { return map; }, get db() { return db; }, get D() { return D; }, ACT, go };
  boot().catch(e => { try { console.error(e); } catch (x) { /* rien */ } if (!map) fail('Lunavia n’a pas pu démarrer. Recharge la page.'); });
})();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) addEventListener("load", function () {
  var sw = navigator.serviceWorker, was = sw.controller, mine = new URL("sw.js", location.href).href;
  sw.register("sw.js").catch(function () {});
  if (was && was.scriptURL !== mine) setTimeout(function () {
    sw.getRegistration().then(function (r) { if (r && r.active && r.active.scriptURL === mine) r.active.postMessage("voisinage"); }).catch(function () {});
  }, 6000);
});
</script>
